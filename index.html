<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#bfe6f5">
<meta name="color-scheme" content="only light"> <!-- the game draws its own colours: a phone's "dark mode for every site" must not darken its panels -->
<title>Tỷ Phú Đất Việt</title>
<!-- The link preview (Messenger, Zalo, Facebook): read without running the page, so it is written here.
     The image needs a whole address: the game's home on Render. tools/icons/render.mjs draws it. -->
<meta name="description" content="Cờ tỷ phú trên bản đồ Việt Nam: chơi một máy hoặc online với bạn bè.">
<meta property="og:type" content="website">
<meta property="og:title" content="Tỷ Phú Đất Việt">
<meta property="og:description" content="Cờ tỷ phú trên bản đồ Việt Nam: chơi một máy hoặc online với bạn bè.">
<meta property="og:url" content="https://ty-phu-dat-viet-oizq.onrender.com/">
<meta property="og:image" content="https://ty-phu-dat-viet-oizq.onrender.com/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="vi_VN">
<meta name="twitter:card" content="summary_large_image">
<style>
  :root { color-scheme: only light; }
  html, body { margin: 0; height: 100%; background: #1d120c; overflow: hidden; }
  body { font-variant-numeric: tabular-nums; }
  canvas { display: block; margin: 0 auto; }
  /* a phone: no scrolling, zooming, text selection or callout while pressing on the game */
  html, body { overscroll-behavior: none; }
  canvas { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  /* The online panel: a name and a room code, over the canvas */
  #online { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(20, 10, 6, 0.7); z-index: 10; padding: 16px; box-sizing: border-box; }
  #online .op-card { width: min(420px, 100%); background: linear-gradient(#3b1712, #1f0c09); border: 2px solid #c9a24a; border-radius: 18px; padding: 22px 22px 16px; box-sizing: border-box; color: #fff8e6; font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
  #online h2 { margin: 0 0 16px; text-align: center; color: #f2c44a; font-size: 24px; }
  #online label { display: block; margin: 0 0 12px; font-size: 16px; color: #e8d9b5; }
  #online input { display: block; width: 100%; box-sizing: border-box; margin-top: 6px; padding: 12px 14px; font-size: 20px; border-radius: 10px; border: 2px solid #8a6a3a; background: #fbf3df; color: #2b1d12; }
  #online input:focus { outline: none; border-color: #f2c44a; }
  #online button { display: block; width: 100%; padding: 13px; margin: 0 0 12px; font-size: 19px; font-weight: bold; border-radius: 12px; border: 2px solid #f2c44a; background: #2b6cd6; color: #fff8e6; cursor: pointer; }
  #online button.op-main { background: #c8201f; }
  #online button.op-close { background: transparent; border-color: #6a4a2a; color: #cbb994; font-weight: normal; margin: 4px 0 0; }
  #online .op-or { text-align: center; color: #cbb994; margin: 8px 0 12px; font-size: 15px; }
  /* The rules page: scrolls on a phone */
  #chat { position: fixed; inset: 0; display: none; align-items: flex-end; justify-content: center; background: rgba(20, 10, 6, 0.35); z-index: 12; padding: 12px; box-sizing: border-box; }
  #chat .ch-card { width: min(640px, 100%); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: linear-gradient(#3b1712, #1f0c09); border: 2px solid #c9a24a; border-radius: 16px; padding: 12px; box-sizing: border-box; font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
  #chat input { flex: 1 1 200px; min-width: 0; padding: 12px; font-size: 18px; border-radius: 10px; border: 2px solid #c9a24a; background: #fff8e6; color: #2a1a10; }
  #chat button { padding: 12px 16px; font-size: 17px; font-weight: bold; border-radius: 10px; border: 2px solid #f2c44a; color: #fff8e6; cursor: pointer; }
  #chat #ch-send { background: #2f8a3a; } #chat #ch-close { background: #6a4a2a; }
  #chat #ch-count { flex-basis: 100%; text-align: right; color: #cbb994; font-size: 13px; }
  #rules { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(20, 10, 6, 0.72); z-index: 11; padding: 12px; box-sizing: border-box; }
  #rules .ru-card { width: min(640px, 100%); max-height: min(100%, 82vh); /* room around it to tap and close */ display: flex; flex-direction: column; background: linear-gradient(#3b1712, #1f0c09); border: 2px solid #c9a24a; border-radius: 18px; padding: 18px 18px 14px; box-sizing: border-box; color: #f4ead2; font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
  #rules h2 { margin: 0 0 8px; text-align: center; color: #f2c44a; font-size: 24px; }
  #rules .ru-body { overflow-y: auto; -webkit-overflow-scrolling: touch; padding-right: 6px; font-size: 16px; line-height: 1.45; }
  #rules h3 { margin: 14px 0 4px; color: #f2c44a; font-size: 18px; }
  #rules ul { margin: 0; padding-left: 20px; }
  #rules li { margin: 3px 0; }
  #rules b { color: #ffe9a8; }
  #rules .ru-close { margin-top: 12px; padding: 12px; font-size: 18px; font-weight: bold; border-radius: 12px; border: 2px solid #f2c44a; background: #6a4a2a; color: #fff8e6; cursor: pointer; }
  /* The settings panel, inside the reading panel (src/ui/settings.ts) */
  #rules .st-row { margin: 6px 0 18px; }
  #rules .st-label { font-size: 18px; font-weight: bold; margin-bottom: 8px; display: flex; justify-content: space-between; }
  #rules input[type=range] { width: 100%; height: 28px; accent-color: #d9622b; }
  #rules .st-two { display: flex; gap: 10px; }
  #rules .st-two button { flex: 1; padding: 12px; font-size: 17px; font-weight: bold; border-radius: 12px; border: 2px solid #c9a24a; background: transparent; color: inherit; cursor: pointer; font-family: inherit; }
  #rules .st-two button.on { background: #c8201f; color: #fff8e6; }
  html.chibi #rules .st-two button { border-color: #e8a86a; } html.chibi #rules .st-two button.on { background: #ff9a76; color: #4a3020; }
  #rules .st-note { margin: 6px 0 0; font-size: 14px; opacity: 0.8; }
  #online #op-error { min-height: 1.2em; margin: 0 0 8px; color: #ff9a8a; font-size: 15px; text-align: center; }
  /* The chibi look (the default; src/core/theme.ts sets html.chibi): cream cards, dark brown words, pastel buttons */
  html.chibi, html.chibi body { background: #bfe6f5; }
  html.chibi #online, html.chibi #rules { background: rgba(70, 110, 130, 0.4); } html.chibi #rules .ru-card { color: #4a3020; } html.chibi #chat { background: rgba(70, 110, 130, 0.25); }
  html.chibi #online .op-card, html.chibi #chat .ch-card, html.chibi #rules .ru-card { font-family: "Baloo 2", "Segoe UI", Arial, sans-serif; background: linear-gradient(#fff3d6, #f7dfb0); border-color: #e8a86a; color: #4a3020; }
  html.chibi #online h2, html.chibi #rules h2, html.chibi #rules h3 { color: #d9622b; }
  html.chibi #online label, html.chibi #online .op-or, html.chibi #chat #ch-count { color: #6a4a32; } html.chibi #rules b { color: #b0501f; }
  html.chibi #online button, html.chibi #chat button, html.chibi #rules .ru-close { border-color: #e8a86a; color: #4a3020; background: #8cc4f5; }
  html.chibi #online button.op-main { background: #ff9a76; } html.chibi #chat #ch-send { background: #8fd16a; }
  html.chibi #chat #ch-close, html.chibi #rules .ru-close { background: #ffe2b0; }
  html.chibi #online button.op-close { background: transparent; color: #6a4a32; border-color: #e8a86a; }
  html.chibi #online #op-error { color: #d9442b; }
  html.chibi #online button, html.chibi #online input, html.chibi #chat button, html.chibi #chat input, html.chibi #rules button { font-family: "Baloo 2", "Segoe UI", Arial, sans-serif; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script type="module" src="./src/main.ts"></script>
</body>
</html>
